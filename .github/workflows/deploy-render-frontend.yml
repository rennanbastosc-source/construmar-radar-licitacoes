name: Deploy Frontend to Render

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-render-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy and wait for live
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          RESP=$(curl -sS -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${API_KEY}" -H "Accept: application/json")
          DEPLOY_ID=$(echo "${RESP}" | jq -r '.id')
          echo "Triggered deploy: ${DEPLOY_ID}"
          for i in $(seq 1 120); do
            sleep 10
            STATUS=$(curl -sS -H "Authorization: Bearer ${API_KEY}" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" | jq -r '.status')
            echo "[$i] deploy status: ${STATUS}"
            case "${STATUS}" in
              live)
                echo "DEPLOY_LIVE"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "DEPLOY_FAILED"
                exit 1
                ;;
            esac
          done
          echo "TIMEOUT waiting for deploy to go live"
          exit 1
