<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Fundo Dark Obsidian com cantos arredondados -->
  <rect width="32" height="32" rx="8" fill="#0E0E10"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#FFFFFF" stroke-opacity="0.12"/>
  
  <!-- Anéis de Radar Construmar (Referência Lucide Radar) -->
  <circle cx="16" cy="16" r="11" stroke="#C0FF73" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 2"/>
  <circle cx="16" cy="16" r="7.5" stroke="#C0FF73" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="4" stroke="#C0FF73" stroke-opacity="0.8" stroke-width="1.5"/>
  
  <!-- Feixe de Varredura Angular (Sweep Beam) -->
  <path d="M16 16 L24 8 A11.3 11.3 0 0 0 16 4.7 Z" fill="#C0FF73" fill-opacity="0.4"/>
  
  <!-- Linha do Scanner Lucide -->
  <line x1="16" y1="16" x2="24" y2="8" stroke="#C0FF73" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Ponto Central Ativo / Pulso de Oportunidade -->
  <circle cx="16" cy="16" r="2.2" fill="#C0FF73"/>
  <circle cx="21" cy="10" r="1.2" fill="#FFFFFF"/>
</svg>
