<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#144272"/>
    </linearGradient>
    <linearGradient id="cOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#F26419"/>
    </linearGradient>
    <linearGradient id="cTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 10)">
    <!-- Central Tower (Main Building) -->
    <path d="M 45 10 L 62 2 L 62 68 L 45 74 Z" fill="url(#cBlueGrad)" />
    <path d="M 45 10 L 28 2 L 28 68 L 45 74 Z" fill="#1B4965" />
    <!-- Tower Windows / Lines Accent -->
    <line x1="36" y1="18" x2="36" y2="58" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="54" y1="18" x2="54" y2="58" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- Left Structural Tower -->
    <path d="M 24 28 L 12 22 L 12 70 L 24 73 Z" fill="#0A2540" />
    <path d="M 24 28 L 26 29 L 26 73 L 24 73 Z" fill="#144272" opacity="0.8"/>

    <!-- Right Accent Tower (Orange / Growth & Energy) -->
    <path d="M 66 26 L 78 20 L 78 68 L 66 73 Z" fill="url(#cOrangeGrad)" />
    <line x1="72" y1="29" x2="72" y2="60" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.8"/>

    <!-- Ocean / Sea Wave & Foundation Base (Dynamic Swooshes) -->
    <!-- Wave 1: Primary Marine Blue -->
    <path d="M 4 78 C 22 66, 44 86, 68 74 C 82 66, 92 72, 96 76 C 88 84, 68 92, 48 84 C 28 77, 14 86, 4 78 Z" fill="url(#cBlueGrad)" />
    
    <!-- Wave 2: Cyan Energy / Precision Flow -->
    <path d="M 12 88 C 30 76, 52 94, 76 82 C 86 77, 92 80, 94 82 C 86 91, 68 99, 46 92 C 28 86, 18 94, 12 88 Z" fill="url(#cTealGrad)" />

    <!-- Wave 3: Construction Orange Accent Splice -->
    <path d="M 64 71 C 76 63, 88 68, 94 74 C 91 78, 80 74, 70 79 Z" fill="url(#cOrangeGrad)" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <!-- CONSTRUMAR Title -->
  <text x="125" y="62" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="2.5" fill="#0A2540">
    CONSTRU<tspan fill="#F26419">MAR</tspan>
  </text>

  <!-- LOCAÇÕES E SERVIÇOS LTDA Subtitle -->
  <text x="128" y="86" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" letter-spacing="3.8" fill="#475569">
    LOCAÇÕES E SERVIÇOS <tspan fill="#F26419" font-weight="800">LTDA</tspan>
  </text>

  <!-- Subtle divider indicator -->
  <line x1="128" y1="96" x2="495" y2="96" stroke="url(#cOrangeGrad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
