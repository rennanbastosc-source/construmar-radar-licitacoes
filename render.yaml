services:
  # Backend: API em Go (Golang)
  - type: web
    name: construmar-radar-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o radar-backend main.go
    startCommand: ./radar-backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: "libsql://construmar-radar-rennanbastosc-source.aws-us-west-2.turso.io?authToken=eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcxMTA2MjEsImlkIjoiMDFhMDE4MTctZTMwMS03NmY4LThlMGEtNmZmMzY0ZmVlMTU2Iiwia2lkIjoiYVFJLWpHbTZyUURCVU9KMG5XcWs4WWhPUWlrTXpxellzb2hfX19FYTJyNCIsInJpZCI6IjMwZjZhMTRhLWY3NTYtNDI4Zi04ZjhjLTk5YjRhOGI0NDNkMCJ9.8hGG1nd0-lBLyZF4pcpvz3Puh0j2ud1RKqDr3nun-KZBtMfOV582o8dVPTB1VQVEgQznqhP7969rFbqkHumDDA"
      - key: PNCP_BASE_URL
        value: https://pncp.gov.br/api/consulta
      - key: DEFAULT_UF
        value: CE
      - key: MIN_ESTIMATED_VALUE
        value: "900000.00"
      - key: SYNC_INTERVAL_HOURS
        value: "24"
      - key: API_AUTH_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # Frontend: Interface Next.js
  - type: web
    name: construmar-radar-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: construmar-radar-backend
          property: host
      - key: NEXT_PUBLIC_API_AUTH_TOKEN
        sync: false
